<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ログイン | TOCORO.清掃</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #f3f6f5;
      color: #1f2926;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, 100%);
      padding: 30px 24px;
      background: #fff;
      border: 1px solid #dce5e2;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(22, 66, 53, 0.1);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 24px; }
    p { margin: 0 0 24px; color: #66736f; text-align: center; }
    label { display: block; margin-bottom: 7px; font-weight: 700; }
    input {
      width: 100%;
      min-height: 50px;
      padding: 10px 12px;
      border: 1px solid #bdcbc7;
      border-radius: 8px;
      font: inherit;
    }
    button {
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: #176b55;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #error {
      display: none;
      margin: 0 0 16px;
      padding: 10px;
      border-radius: 8px;
      background: #fdecea;
      color: #a3261d;
      text-align: left;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        position: fixed;
        inset: 0;
        min-height: 0;
        height: 100dvh;
        padding:
          max(14px, env(safe-area-inset-top))
          16px
          max(14px, env(safe-area-inset-bottom));
        place-items: start center;
      }
      main {
        margin-top: clamp(34px, 10dvh, 78px);
        padding: 24px 20px;
      }
      p { margin-bottom: 20px; }
    }
    @media (max-width: 600px) and (max-height: 560px) {
      main {
        margin-top: 8px;
        padding-block: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>TOCORO.清掃</h1>
    <p>共通パスワードを入力してください。</p>
    <div id="error" role="alert"></div>
    <form method="post" action="/login">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">ログイン</button>
    </form>
  </main>
  <script>
    try {
      localStorage.removeItem("selectedStaffForLoginSession");
    } catch (error) {
      console.warn("担当者名の一時保存を削除できませんでした。", error);
    }

    const error = new URLSearchParams(location.search).get("error");
    const errorEl = document.getElementById("error");
    if (error) {
      errorEl.style.display = "block";
      errorEl.textContent = error === "locked"
        ? "失敗回数が多すぎます。15分後にもう一度お試しください。"
        : "パスワードが違います。";
    }
  </script>
</body>
</html>
