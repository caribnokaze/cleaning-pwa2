<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>希望シフト | TOCORO. 清掃管理</title>
  <link rel="stylesheet" href="/shift-requests/calendar.css">
  <script src="/session.js" defer></script>
  <script src="/shift-requests/calendar.js" defer></script>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>希望シフト</h1>
      <nav class="header-links" aria-label="ページ操作">
        <a class="back-link" href="/index.html">清掃報告</a>
        <a class="back-link" href="/gallery.html">写真一覧</a>
        <a class="back-link logout-link" href="/logout">ログアウト</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="filters" aria-label="表示条件">
      <div class="field staff-field">
        <label for="staff">担当者</label>
        <select id="staff" disabled><option value="">担当者を選択</option></select>
      </div>
      <div class="field month-field">
        <label for="month">表示する年月</label>
        <div class="month">
          <button id="previous" type="button" disabled>前月</button>
          <select id="month" disabled><option value="">年月を選択</option></select>
          <button id="next" type="button" disabled>翌月</button>
          <button id="reload" type="button" disabled>再読み込み</button>
        </div>
      </div>
    </section>
    <p id="legacy-notice" class="notice" hidden>GAS更新までは、複数提出がある場合に一番下の回答が表示されるとは限りません。</p>
    <p id="status" role="status"></p>
    <section class="calendar-card" aria-label="希望シフトカレンダー">
      <div class="week weekday-row" aria-hidden="true"><span class="sunday-heading">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="saturday-heading">土</span></div>
      <div id="days" class="week" role="group" aria-label="月間カレンダー"></div>
      <div class="calendar-footer">
        <div class="legend" aria-label="カレンダーの凡例">
          <span class="code">可能件数</span><span class="rest">休</span><span class="pending">未定</span>
        </div>
        <p id="detail" aria-live="polite"></p>
      </div>
    </section>
  </main>
</body>
</html>
